<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#714B67"/>
      <stop offset="100%" style="stop-color:#4a2f47"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#017e84"/>
      <stop offset="100%" style="stop-color:#015f64"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="rgba(0,0,0,0.3)"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="200" height="200" rx="32" fill="url(#bg)"/>
  <!-- Subtle inner glow -->
  <rect width="200" height="200" rx="32" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>
  <!-- Bottom accent bar -->
  <rect x="0" y="176" width="200" height="24" rx="0" fill="url(#accent)" opacity="0.85"/>
  <rect x="0" y="176" width="200" height="24" rx="0" fill="none"/>
  <path d="M0 176 Q0 200 32 200 H168 Q200 200 200 176 Z" fill="url(#accent)" opacity="0.85"/>
  <!-- 3x3 dot grid -->
  <circle cx="65"  cy="72"  r="11" fill="#fff" opacity="0.92" filter="url(#shadow)"/>
  <circle cx="100" cy="72"  r="11" fill="#fff" opacity="0.92" filter="url(#shadow)"/>
  <circle cx="135" cy="72"  r="11" fill="#fff" opacity="0.92" filter="url(#shadow)"/>
  <circle cx="65"  cy="107" r="11" fill="#fff" opacity="0.92" filter="url(#shadow)"/>
  <circle cx="100" cy="107" r="13" fill="url(#accent)" filter="url(#shadow)"/>
  <circle cx="135" cy="107" r="11" fill="#fff" opacity="0.92" filter="url(#shadow)"/>
  <circle cx="65"  cy="142" r="11" fill="#fff" opacity="0.92" filter="url(#shadow)"/>
  <circle cx="100" cy="142" r="11" fill="#fff" opacity="0.92" filter="url(#shadow)"/>
  <circle cx="135" cy="142" r="11" fill="#fff" opacity="0.92" filter="url(#shadow)"/>
</svg>
