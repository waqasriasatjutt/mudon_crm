<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="60%" y2="100%">
      <stop offset="0%"   style="stop-color:#3d2040"/>
      <stop offset="50%"  style="stop-color:#714B67"/>
      <stop offset="100%" style="stop-color:#017e84"/>
    </linearGradient>
    <linearGradient id="card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="100%" style="stop-color:#f8f9fa"/>
    </linearGradient>
    <filter id="cardShadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="rgba(0,0,0,0.18)"/>
    </filter>
    <filter id="navShadow">
      <feDropShadow dx="0" dy="1" stdDeviation="3" flood-color="rgba(0,0,0,0.08)"/>
    </filter>
  </defs>

  <!-- Background gradient -->
  <rect width="1280" height="720" fill="url(#bg)"/>

  <!-- Navbar -->
  <rect x="0" y="0" width="1280" height="46" fill="#fff" filter="url(#navShadow)"/>
  <!-- Grid button -->
  <rect x="16" y="16" width="4" height="4" rx="0.5" fill="#714B67"/>
  <rect x="22" y="16" width="4" height="4" rx="0.5" fill="#714B67"/>
  <rect x="28" y="16" width="4" height="4" rx="0.5" fill="#714B67"/>
  <rect x="16" y="22" width="4" height="4" rx="0.5" fill="#714B67"/>
  <rect x="22" y="22" width="4" height="4" rx="0.5" fill="#714B67"/>
  <rect x="28" y="22" width="4" height="4" rx="0.5" fill="#714B67"/>
  <rect x="16" y="28" width="4" height="4" rx="0.5" fill="#714B67"/>
  <rect x="22" y="28" width="4" height="4" rx="0.5" fill="#714B67"/>
  <rect x="28" y="28" width="4" height="4" rx="0.5" fill="#714B67"/>
  <!-- Systray icons (right side) -->
  <circle cx="1220" cy="23" r="14" fill="#e7e9ed"/>
  <text x="1220" y="28" font-family="Arial" font-size="12" fill="#374151" text-anchor="middle">JD</text>
  <circle cx="1180" cy="23" r="14" fill="#e7e9ed"/>
  <text x="1180" y="28" font-family="Arial" font-size="14" fill="#374151" text-anchor="middle">&#9993;</text>
  <circle cx="1245" cy="16" r="6" fill="#e74c3c"/>
  <text x="1245" y="20" font-family="Arial" font-size="8" fill="#fff" text-anchor="middle">3</text>

  <!-- App grid container -->
  <text x="640" y="110" font-family="'Helvetica Neue',Arial,sans-serif" font-size="15" fill="rgba(255,255,255,0.5)" text-anchor="middle" letter-spacing="3">APPLICATIONS</text>

  <!-- App icons — row 1 -->
  <!-- App 1: Accounting -->
  <rect x="290" y="130" width="100" height="120" rx="12" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
  <rect x="315" y="145" width="50" height="50" rx="10" fill="#714B67" filter="url(#cardShadow)"/>
  <text x="340" y="178" font-family="Arial" font-size="22" fill="#fff" text-anchor="middle">$</text>
  <text x="340" y="220" font-family="'Helvetica Neue',Arial,sans-serif" font-size="11" fill="rgba(255,255,255,0.85)" text-anchor="middle">Accounting</text>

  <!-- App 2: Sales -->
  <rect x="410" y="130" width="100" height="120" rx="12" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
  <rect x="435" y="145" width="50" height="50" rx="10" fill="#017e84" filter="url(#cardShadow)"/>
  <text x="460" y="178" font-family="Arial" font-size="22" fill="#fff" text-anchor="middle">&#128200;</text>
  <text x="460" y="220" font-family="'Helvetica Neue',Arial,sans-serif" font-size="11" fill="rgba(255,255,255,0.85)" text-anchor="middle">Sales</text>

  <!-- App 3: Inventory -->
  <rect x="530" y="130" width="100" height="120" rx="12" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
  <rect x="555" y="145" width="50" height="50" rx="10" fill="#875a7b" filter="url(#cardShadow)"/>
  <text x="580" y="178" font-family="Arial" font-size="22" fill="#fff" text-anchor="middle">&#128230;</text>
  <text x="580" y="220" font-family="'Helvetica Neue',Arial,sans-serif" font-size="11" fill="rgba(255,255,255,0.85)" text-anchor="middle">Inventory</text>

  <!-- App 4: HR (highlighted/focused) -->
  <rect x="650" y="122" width="108" height="128" rx="14" fill="rgba(255,255,255,0.15)" stroke="rgba(1,126,132,0.7)" stroke-width="2"/>
  <rect x="675" y="137" width="58" height="58" rx="12" fill="#017e84" filter="url(#cardShadow)"/>
  <text x="704" y="174" font-family="Arial" font-size="26" fill="#fff" text-anchor="middle">&#128101;</text>
  <text x="704" y="222" font-family="'Helvetica Neue',Arial,sans-serif" font-size="11" fill="#fff" text-anchor="middle" font-weight="600">Employees</text>

  <!-- App 5: CRM -->
  <rect x="778" y="130" width="100" height="120" rx="12" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
  <rect x="803" y="145" width="50" height="50" rx="10" fill="#714B67" filter="url(#cardShadow)"/>
  <text x="828" y="178" font-family="Arial" font-size="22" fill="#fff" text-anchor="middle">&#127760;</text>
  <text x="828" y="220" font-family="'Helvetica Neue',Arial,sans-serif" font-size="11" fill="rgba(255,255,255,0.85)" text-anchor="middle">CRM</text>

  <!-- App 6: Project -->
  <rect x="898" y="130" width="100" height="120" rx="12" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
  <rect x="923" y="145" width="50" height="50" rx="10" fill="#017e84" filter="url(#cardShadow)"/>
  <text x="948" y="178" font-family="Arial" font-size="22" fill="#fff" text-anchor="middle">&#128203;</text>
  <text x="948" y="220" font-family="'Helvetica Neue',Arial,sans-serif" font-size="11" fill="rgba(255,255,255,0.85)" text-anchor="middle">Project</text>

  <!-- App icons — row 2 -->
  <rect x="290" y="280" width="100" height="120" rx="12" fill="rgba(255,255,255,0.07)"/>
  <rect x="315" y="295" width="50" height="50" rx="10" fill="#875a7b"/>
  <text x="340" y="355" font-family="'Helvetica Neue',Arial,sans-serif" font-size="11" fill="rgba(255,255,255,0.75)" text-anchor="middle">Purchase</text>

  <rect x="410" y="280" width="100" height="120" rx="12" fill="rgba(255,255,255,0.07)"/>
  <rect x="435" y="295" width="50" height="50" rx="10" fill="#714B67"/>
  <text x="460" y="355" font-family="'Helvetica Neue',Arial,sans-serif" font-size="11" fill="rgba(255,255,255,0.75)" text-anchor="middle">Website</text>

  <rect x="530" y="280" width="100" height="120" rx="12" fill="rgba(255,255,255,0.07)"/>
  <rect x="555" y="295" width="50" height="50" rx="10" fill="#017e84"/>
  <text x="580" y="355" font-family="'Helvetica Neue',Arial,sans-serif" font-size="11" fill="rgba(255,255,255,0.75)" text-anchor="middle">Manufacturing</text>

  <rect x="650" y="280" width="100" height="120" rx="12" fill="rgba(255,255,255,0.07)"/>
  <rect x="675" y="295" width="50" height="50" rx="10" fill="#875a7b"/>
  <text x="700" y="355" font-family="'Helvetica Neue',Arial,sans-serif" font-size="11" fill="rgba(255,255,255,0.75)" text-anchor="middle">Point of Sale</text>

  <rect x="778" y="280" width="100" height="120" rx="12" fill="rgba(255,255,255,0.07)"/>
  <rect x="803" y="295" width="50" height="50" rx="10" fill="#714B67"/>
  <text x="828" y="355" font-family="'Helvetica Neue',Arial,sans-serif" font-size="11" fill="rgba(255,255,255,0.75)" text-anchor="middle">Payroll</text>

  <rect x="898" y="280" width="100" height="120" rx="12" fill="rgba(255,255,255,0.07)"/>
  <rect x="923" y="295" width="50" height="50" rx="10" fill="#017e84"/>
  <text x="948" y="355" font-family="'Helvetica Neue',Arial,sans-serif" font-size="11" fill="rgba(255,255,255,0.75)" text-anchor="middle">Settings</text>

  <!-- Caption -->
  <text x="640" y="680" font-family="'Helvetica Neue',Arial,sans-serif" font-size="14" fill="rgba(255,255,255,0.6)" text-anchor="middle">Enterprise-style full-page Home Menu with animated app grid</text>
</svg>
